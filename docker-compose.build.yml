services:
  app:
    build: .
    image: subtrack:latest
    ports:
      - "8080:80"
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://subtrack:${POSTGRES_PASSWORD:-subtrack}@postgres:5432/subtrack?schema=public
      APP_PASSWORD: ${APP_PASSWORD:?Set APP_PASSWORD in your shell or .env file}
      SESSION_SECRET: ${SESSION_SECRET:?Set SESSION_SECRET in your shell or .env file}
      MAX_GENERATED_PAYMENTS: ${MAX_GENERATED_PAYMENTS:-1000}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: subtrack
      POSTGRES_USER: subtrack
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-subtrack}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U subtrack -d subtrack"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  postgres-data:
